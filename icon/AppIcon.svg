<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3A67"/>
      <stop offset="1" stop-color="#0F1428"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE1D2"/>
      <stop offset="1" stop-color="#3B8CFF"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.38"/>
    </filter>
    <filter id="xshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 图标主体：824×824 圆角方块，四周留 100 边距 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>

  <!-- 字母 X：先画白色那一笔，再画渐变点缀色那一笔压在上面 -->
  <g stroke-linecap="round" fill="none" filter="url(#xshadow)">
    <line x1="338" y1="338" x2="686" y2="686" stroke="#F4F6FF" stroke-width="128"/>
    <line x1="686" y1="338" x2="338" y2="686" stroke="url(#accent)" stroke-width="128"/>
  </g>
</svg>
